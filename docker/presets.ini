; One llama.cpp router, three presets.
;
; Verified against llama.cpp v0.7.x (build b11804, 22 October 2026).
; The section name is the model id that the app sends in the request body.
;
; Paths are inside the container. The compose file mounts ../models at /models
; read-only, so the router can never write to the model directory.

version = 1

[*]
; Keep flash attention on for the CUDA build. "auto" lets llama.cpp decide.
flash-attn = auto
; One request at a time is enough for the demo and keeps the KV budget small.
parallel = 1
; Do not let an idle model sleep in the middle of a recorded turn.
sleep-idle-seconds = -1

[embeddinggemma-2]
model = /models/embeddinggemma-2-Q8_0.gguf
; An encoder must be served in embedding mode, not chat mode.
embeddings = true
pooling = mean
ctx-size = 4096
batch-size = 4096
ubatch-size = 4096
n-gpu-layers = all
cache-ram = 0
load-on-startup = true

[lfm2-8b]
model = /models/LFM2.5-8B-A1B-Q4_K_M.gguf
ctx-size = 16384
batch-size = 2048
ubatch-size = 512
n-gpu-layers = all
temp = 0.2
top-p = 0.9
top-k = 40
repeat-penalty = 1.05
load-on-startup = true

[d1-3b]
model = /models/d1-3B-Q8_0.gguf
ctx-size = 8192
batch-size = 2048
ubatch-size = 2048
n-gpu-layers = all
; Decision requests return no generated tokens, so the prompt cache is waste.
cache-ram = 0
load-on-startup = true
