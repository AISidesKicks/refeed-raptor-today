[workspace]
authors = ["AISidesKicks <198066858+AISidesKicks@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "rptr"
platforms = ["linux-64"]
version = "0.1.0"

[activation]

[activation.env]
TMPDIR = "/run/user/$UID/pixi_tmp/$PIXI_PROJECT_NAME"
SCRATCH = "$PIXI_PROJECT_ROOT/scratch"
PYTHONPATH = "$PIXI_PROJECT_ROOT/src"

[tasks]
serve = 'sh -c "uvicorn rptr.app:app --host 0.0.0.0 --port ${RPTR_PORT:-8000}"'
test = "pytest -q"
index = "python -m rptr.index"
embed = "python -m rptr.embed"
build-tree = "python -m rptr.tree"
eval = "python -m rptr.eval"
record = "python -m rptr.record"
build-corpus = "python lab/demos/raptor-reserve/tools/build_corpus.py"
models = "bash docker/download-models.sh"
models-check = "bash docker/download-models.sh --check"
llm-up = "docker compose -f docker/compose.yaml up -d rptr-llm"
llm-stop = "docker compose -f docker/compose.yaml stop rptr-llm"
llm-logs = "docker compose -f docker/compose.yaml logs -f rptr-llm"
phoenix-up = "docker compose -f docker/compose.yaml up -d rptr-phoenix"
phoenix-stop = "docker compose -f docker/compose.yaml stop rptr-phoenix"
stack-down = "docker compose -f docker/compose.yaml down"

[dependencies]
python = "==3.12"
fastapi = ">=0.115"
uvicorn = ">=0.30"
numpy = ">=2.0"
pydantic = ">=2.8"
httpx = ">=0.27"
pytest = ">=8.0"
websockets = ">=12.0"
ruff = ">=0.6"
scikit-learn = ">=1.9.1,<2"
umap-learn = ">=0.5.12,<0.6"
opentelemetry-sdk = ">=1.45.1,<2"
opentelemetry-exporter-otlp-proto-http = ">=1.45.1,<2"
